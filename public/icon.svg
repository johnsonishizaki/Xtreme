<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Stylized "X" lettermark with Duty / Reminder Flare -->
  <g transform="translate(96, 96)">
    <!-- Back Glow -->
    <path d="M40 40 L280 280 M280 40 L40 280" stroke="#10b981" stroke-width="48" stroke-linecap="round" opacity="0.3" filter="url(#glow)" />
    
    <!-- Primary X Strokes -->
    <path d="M40 40 L280 280" stroke="url(#accent)" stroke-width="42" stroke-linecap="round" />
    <path d="M280 40 L40 280" stroke="#f8fafc" stroke-width="42" stroke-linecap="round" />

    <!-- Notification Bell Accent in Top-Right -->
    <circle cx="270" cy="50" r="28" fill="#10b981" stroke="#020617" stroke-width="6" />
    <path d="M264 42 C264 38 276 38 276 42 C276 48 280 50 280 52 L260 52 C260 50 264 48 264 42 Z" fill="#ffffff" />
    <circle cx="270" cy="56" r="3" fill="#ffffff" />
  </g>
</svg>
